name: Accessibility - WCAG Compliance
on:
  push:
    branches: [main]
    paths:
      - "src/components/**"
      - "src/app/**"
  pull_request:
    branches: [main]
    paths:
      - "src/components/**"
      - "src/app/**"
  schedule:
    - cron: "0 4 * * 1" # Every Monday at 4 AM UTC
  workflow_dispatch:

concurrency:
  group: a11y-${{ github.ref_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  ##############################################################################
  # AXE-CORE ACCESSIBILITY TESTS
  ##############################################################################
  axe-tests:
    name: axe-core Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run Accessibility Tests
        run: npx vitest run tests/accessibility/ --reporter=junit --outputFile=reports/junit-a11y.xml
      - uses: ./.github/actions/test-reporter
        with:
          coverage: "false"
          lighthouse: "false"
          build-logs: "false"

  ##############################################################################
  # PLAYWRIGHT ACCESSIBILITY AUDIT
  ##############################################################################
  playwright-a11y:
    name: Playwright A11y Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          install-playwright: "true"
          playwright-browsers: "chromium"
      - name: Build Application
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      - name: Start Server
        run: |
          npm run start &
          npx wait-on http://localhost:3000 --timeout 30000
      - name: Run A11y Scans
        run: npx playwright test e2e/a11y.spec.ts --project=chromium --reporter=list
      - name: Stop Server
        if: always()
        run: kill $(lsof -t -i:3000) 2>/dev/null || true

  ##############################################################################
  # WCAG VALIDATION
  ##############################################################################
  wcag-validation:
    name: WCAG Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check ARIA Attributes
        run: |
          echo "## ♿ WCAG Compliance Check" > a11y-report.md
          echo "" >> a11y-report.md
          echo "### ARIA Attribute Check" >> a11y-report.md
          echo 'Checking for common ARIA issues...' >> a11y-report.md
          EMPTY_ARIA=$(grep -r 'aria-label=""' src/components/ --include="*.tsx" 2>/dev/null || true)
          if [ -n "$EMPTY_ARIA" ]; then
            echo "⚠️ Found empty aria-labels:" >> a11y-report.md
            echo "$EMPTY_ARIA" >> a11y-report.md
          else
            echo "✅ No empty aria-labels found" >> a11y-report.md
          fi
          ARIA_ROLES=$(grep -r 'role=' src/components/ --include="*.tsx" 2>/dev/null | head -20 || true)
          if [ -n "$ARIA_ROLES" ]; then
            echo "✅ ARIA roles found in components:" >> a11y-report.md
            echo "$ARIA_ROLES" >> a11y-report.md
          fi
          echo "" >> a11y-report.md
          echo "### Alt Text Check" >> a11y-report.md
          EMPTY_ALT=$(grep -r 'alt={""}' src/components/ --include="*.tsx" 2>/dev/null || true)
          if [ -n "$EMPTY_ALT" ]; then
            echo "⚠️ Found decorative images without proper alt text:" >> a11y-report.md
            echo "$EMPTY_ALT" >> a11y-report.md
          else
            echo "✅ No empty alt text found" >> a11y-report.md
          fi
          cat a11y-report.md

  ##############################################################################
  # KEYBOARD NAVIGATION
  ##############################################################################
  keyboard-nav:
    name: Keyboard Navigation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Keyboard Accessibility
        run: |
          echo "## ⌨️ Keyboard Navigation Check" > a11y-report.md
          echo "" >> a11y-report.md
          echo "Checking for keyboard accessibility patterns..." >> a11y-report.md
          KB_EVENTS=$(grep -r 'onKeyDown\|onKeyPress\|tabIndex' src/components/ --include="*.tsx" 2>/dev/null | head -20 || true)
          if [ -n "$KB_EVENTS" ]; then
            echo "✅ Keyboard event handlers found:" >> a11y-report.md
            echo "$KB_EVENTS" >> a11y-report.md
          else
            echo "⚠️ No keyboard event handlers found" >> a11y-report.md
          fi
          echo "" >> a11y-report.md
          echo "### Focus Management" >> a11y-report.md
          FOCUS=$(grep -r 'focus\|useRef' src/components/ui/ --include="*.tsx" 2>/dev/null | head -10 || true)
          if [ -n "$FOCUS" ]; then
            echo "✅ Focus management patterns found:" >> a11y-report.md
            echo "$FOCUS" >> a11y-report.md
          else
            echo "⚠️ No focus management patterns found" >> a11y-report.md
          fi
          cat a11y-report.md

  ##############################################################################
  # COLOR CONTRAST
  ##############################################################################
  color-contrast:
    name: Color Contrast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Color Contrast
        run: |
          echo "## 🎨 Color Contrast Check" > a11y-report.md
          echo "" >> a11y-report.md
          echo "Checking Tailwind config for accessible colors..." >> a11y-report.md
          # Tailwind v4 uses CSS-based config (no JS config file)
          if [ -f "tailwind.config.ts" ] || [ -f "tailwind.config.js" ]; then
            echo "✅ Tailwind JS config found" >> a11y-report.md
          elif grep -q '@import "tailwindcss"' src/app/globals.css 2>/dev/null; then
            echo "✅ Tailwind v4 CSS-based config detected" >> a11y-report.md
          else
            echo "⚠️ No Tailwind config found" >> a11y-report.md
          fi
          echo "" >> a11y-report.md
          echo "### Dark mode color contrast spot-check" >> a11y-report.md
          LOW_CONTRAST=$(grep -rn 'text-zinc-500 dark:text-zinc-500' src/ --include="*.tsx" 2>/dev/null || true)
          if [ -n "$LOW_CONTRAST" ]; then
            echo "⚠️ Found text-zinc-500 dark:text-zinc-500 (may fail dark-mode contrast):" >> a11y-report.md
            echo "$LOW_CONTRAST" >> a11y-report.md
          else
            echo "✅ No known low-contrast patterns found" >> a11y-report.md
          fi
          cat a11y-report.md

  ##############################################################################
  # SUMMARY
  ##############################################################################
  summary:
    name: Accessibility Summary
    if: always()
    needs: [axe-tests, playwright-a11y, wcag-validation, keyboard-nav, color-contrast]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate A11y Results
        run: |
          echo "📊 Accessibility Results:"
          echo "  axe-core Tests: ${{ needs.axe-tests.result }}"
          echo "  Playwright A11y: ${{ needs.playwright-a11y.result }}"
          echo "  WCAG Validation: ${{ needs.wcag-validation.result }}"
          echo "  Keyboard Nav: ${{ needs.keyboard-nav.result }}"
          echo "  Color Contrast: ${{ needs.color-contrast.result }}"
          echo "✅ Accessibility checks completed"
